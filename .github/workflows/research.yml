name: Research leads
on:
  schedule:
    - cron: '17 5 * * 1,3,5'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect leads
        run: python scripts/discover.py --output research/queue.md
      - name: Create review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Research candidates — $(date -u +%F)"
          if ! gh issue list --state all --search "in:title $title" --json title --jq '.[].title' | grep -Fxq "$title"; then
            gh issue create --title "$title" --body-file research/queue.md
          fi
